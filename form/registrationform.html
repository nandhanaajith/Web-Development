<input type="tel"required><br><br>
<label>Email:</label>
<input type="email" id="email" required><br><br>

<input type="radio" id="gender"><label>Male</label>
<input type="radio" id="gender"><label>Female</label>
<input type="radio" id="gender"><label>Others</label><br><br>
</fieldset><br>
<label>Address:</label>
<textarea id="address" required></textarea><br><br>
<label>Languages knowns:</label>

<input type="checkbox" id="language"><label>English</label>
<input type="checkbox" id="language"><label>Hindi</label><br><br>

<option>MCA</option>

</select><br><br>
<button>Reset</button>

</form>
</body>
